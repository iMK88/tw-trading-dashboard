# 衡析 App（Android）：建置 AAB（上架 Google Play 用）。手動執行或推送 app-v* 標籤時觸發。
# 秘密（Settings → Secrets and variables → Actions）：
#   ANDROID_KEYSTORE_BASE64、ANDROID_KEYSTORE_PASSWORD、ANDROID_KEY_ALIAS、ANDROID_KEY_PASSWORD：上傳金鑰（沒有時產生未簽署的 AAB）
#   GOOGLE_SERVICES_JSON_BASE64：Firebase 的 google-services.json（沒有時 App 沒有推播）
#   PLAY_SERVICE_ACCOUNT_JSON：Play Console API 服務帳戶（有時自動上傳到內部測試軌）
# 變數（Variables）：EQUILENS_RELAY_URL（推播中繼網址）、EQUILENS_APP_ID（套件名稱，預設 io.github.wakin61043.equilens）
name: App · Android
on:
  workflow_dispatch:
    inputs:
      version_name: { description: '版本名稱（例如 1.0.0）', required: false, default: '' }
  push:
    tags: ['app-v*']
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { shell: bash, working-directory: EquiLens-App/android } }
    env:
      HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' && secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: 測試（推播中繼、示意資料查詢規則）
        working-directory: EquiLens-App
        run: npm test
      - name: 準備秘密
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GSERVICES: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"; echo "EQUILENS_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"; fi
          if [ -n "$GSERVICES" ]; then echo "$GSERVICES" | base64 -d > app/google-services.json; fi
      - name: 建置 AAB
        env:
          EQUILENS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          EQUILENS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          EQUILENS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EQUILENS_RELAY_URL: ${{ vars.EQUILENS_RELAY_URL }}
          EQUILENS_APP_ID: ${{ vars.EQUILENS_APP_ID }}
          EQUILENS_VERSION_CODE: ${{ github.run_number }}
          EQUILENS_VERSION_NAME: ${{ inputs.version_name || (startsWith(github.ref_name, 'app-v') && github.ref_name || '') }}
        run: |
          export EQUILENS_VERSION_NAME="${EQUILENS_VERSION_NAME#app-v}"
          [ -n "$EQUILENS_VERSION_NAME" ] || unset EQUILENS_VERSION_NAME
          ./gradlew --no-daemon testDebugUnitTest bundleRelease
      - uses: actions/upload-artifact@v4
        with: { name: equilens-android-aab, path: EquiLens-App/android/app/build/outputs/bundle/release/*.aab }
      - name: 上傳到 Play 內部測試
        if: env.HAS_PLAY == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ vars.EQUILENS_APP_ID || 'io.github.wakin61043.equilens' }}
          releaseFiles: EquiLens-App/android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
